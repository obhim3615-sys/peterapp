version: "3.9"

services:

  redis:
    image: redis:7
    container_name: redis
    ports:
      - "6379:6379"

  django:
    build: .
    container_name: django_app
    ports:
      - "8000:8000"
    env_file:
      - .env
    depends_on:
      - redis

  celery:
    build: .
    container_name: celery_worker
    command: celery -A Project worker -l info --concurrency=2
    env_file:
      - .env
    depends_on:
      - redis