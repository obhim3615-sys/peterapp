<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Graph</title>
</head>
<body style="background-color: #355600;">
    <div  >
    {% for i in graphic %}
    <div style="width:100%; margin:0 auto;">
        <img alt="graph-" src="data:image/png;base64,{{ i|safe }}" width="100%">
    </div>
    {% empty %}
    <h4>No graph found</h4>
    {% endfor %}
    </div>
</body>
</html>
